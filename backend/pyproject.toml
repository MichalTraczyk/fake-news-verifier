[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend + AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",

    # ai
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-community>=0.4",
    "pypdf>=5.0",

    "langchain-postgres>=0.0.15",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "nbstripout>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web", "src/ai"]

#tools
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs running Postgres and/or real LLM (deselect with -m 'not integration')",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]